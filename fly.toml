app = "crc-app"
primary_region = "dfw"
kill_signal = "SIGTERM"

[build]

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PHX_HOST = "caferaicescultura.cafe"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.status]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/"
    port = 4000
    timeout = "5s"
    type = "http"
